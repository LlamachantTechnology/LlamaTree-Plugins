<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Session notes</title>
  <style>
    :root { --bg: #1e1e1e; --panel: #252526; --border: #3c3c3c; --text: #d4d4d4; --dim: #9d9d9d; --accent: #3794ff; }
    :root[data-theme="light"] { --bg: #ffffff; --panel: #f3f3f3; --border: #d4d4d4; --text: #1f1f1f; --dim: #6b6b6b; --accent: #0067c0; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
    header, footer { display: flex; gap: 6px; align-items: center; padding: 8px; }
    header { border-bottom: 1px solid var(--border); }
    footer { border-top: 1px solid var(--border); flex-wrap: wrap; }
    select, textarea, button { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 4px; }
    select { flex: 1; min-width: 0; padding: 4px; }
    button { padding: 4px 10px; cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button:disabled { opacity: .5; cursor: default; }
    main { flex: 1; display: flex; flex-direction: column; padding: 8px; gap: 6px; min-height: 0; }
    textarea { flex: 1; resize: none; padding: 8px; line-height: 1.5; min-height: 120px; }
    label { display: flex; gap: 6px; align-items: flex-start; color: var(--text); }
    .note { color: var(--dim); font-size: 12px; }
    .grow { flex: 1; }
  </style>
</head>
<body>
  <header>
    <select id="session" aria-label="Session" title="The session whose notes these are"></select>
    <button id="refresh" title="Read the sessions again">↻</button>
  </header>
  <main>
    <textarea id="text" spellcheck="false" aria-label="Notes" placeholder="No notes yet. Write your own, or have the session's agent keep them."></textarea>
    <label><input type="checkbox" id="keep"> <span>Have this session's agent keep notes here, and give them back to it after a compaction</span></label>
    <p class="note" id="status"></p>
  </main>
  <footer>
    <span class="note grow" id="saved"></span>
    <button id="save" class="primary" disabled>Save</button>
  </footer>
  <script src="notes.js"></script>
</body>
</html>
